<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join The Garden Friend | Volunteer Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="register-page">

    <header class="site-header">
        <div class="container nav-wrapper">
            <div class="logo">
                <a href="index.html">
                    <img src="Images/logo%20wide.jpeg" alt="The Garden Friend Logo" style="height: 50px; width: auto;">
                </a>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Back to Home</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="registration-wrapper">

        <div id="collage-bg" class="collage-container"></div>

        <div class="form-card">
            <div class="form-header">
                <h2>Join Our Community</h2>
                <p>Register your interest below and we'll be in touch to welcome you to the garden.</p>
            </div>

            <iframe data-tally-src="https://tally.so/embed/2Exj4g?hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="706" frameborder="0" marginheight="0" marginwidth="0" title="Register Your Interest"></iframe>
            <script>
                var d = document,
                    w = "https://tally.so/widgets/embed.js",
                    v = function() {
                        "undefined" != typeof Tally ? Tally.loadEmbeds() : d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e) {
                            e.src = e.dataset.tallySrc
                        }))
                    };
                if ("undefined" != typeof Tally) v();
                else if (d.querySelector('script[src="' + w + '"]') == null) {
                    var s = d.createElement("script");
                    s.src = w, s.onload = v, s.onerror = v, d.body.appendChild(s);
                }
            </script>
        </div>

    </section>

    <script src="https://tally.so/widgets/embed.js"></script>
    <script src="collage.js"></script>

</body>

</html>
